<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Photo Print</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 24px;
    }

    .section {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="file"],
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      font-size: 16px;
    }

    input[type="file"] {
      padding: 10px;
    }

    .file-info {
      margin-top: 8px;
      padding: 10px;
      border-radius: 8px;
      background: #f5f5f5;
      font-size: 14px;
      word-break: break-word;
    }

    .pdf-box {
      display: none;
      margin-top: 12px;
      padding: 14px;
      border-radius: 10px;
      background: #fff7e6;
      border: 1px solid #f0c36d;
    }

    .pdf-pages {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .hint {
      margin-top: 7px;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    .examples {
      margin-top: 8px;
      padding: 10px;
      background: #f7f7f7;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
    }

    .radio-group {
      display: flex;
      gap: 10px;
    }

    .radio-option {
      flex: 1;
      position: relative;
    }

    .radio-option input {
      display: none;
    }

    .radio-option span {
      display: block;
      text-align: center;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
      background: white;
      font-weight: normal;
    }

    .radio-option input:checked + span {
      border-color: #111;
      background: #eee;
      font-weight: bold;
    }

    .print-button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #111;
      color: white;
    }

    .print-button:hover {
      opacity: 0.9;
    }

    .print-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
      word-break: break-word;
    }

    .status.success {
      display: block;
      background: #e8f7e8;
      color: #176b17;
      border: 1px solid #9bd49b;
    }

    .status.error {
      display: block;
      background: #ffeaea;
      color: #a40000;
      border: 1px solid #e0a0a0;
    }

    .status.loading {
      display: block;
      background: #eeeeee;
      color: #333;
      border: 1px solid #ccc;
    }

    .preview {
      display: none;
      margin-top: 12px;
      text-align: center;
    }

    .preview img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Photo Print</h1>

  <div class="subtitle">
    Upload your photo or PDF and place your print order
  </div>

  <form id="printForm">

    <!-- FILE -->
    <div class="section">

      <label for="photo">
        Select Photo / PDF
      </label>

      <input
        type="file"
        id="photo"
        name="photo"
        accept="image/*,application/pdf,.pdf"
        required
      >

      <div id="fileInfo" class="file-info">
        No file selected
      </div>

      <!-- IMAGE PREVIEW -->
      <div id="preview" class="preview">
        <img id="previewImage" alt="Preview">
      </div>

      <!-- PDF SECTION -->
      <div id="pdfBox" class="pdf-box">

        <div id="pdfPages" class="pdf-pages">
          PDF pages: detecting...
        </div>

        <label for="pageSelection">
          Pages to Print
        </label>

        <input
          type="text"
          id="pageSelection"
          name="page_selection"
          placeholder="Example: 1-3,6,9-10"
          autocomplete="off"
        >

        <div class="hint">
          Blank chhodoge to <b>saare pages</b> print honge.
        </div>

        <div class="examples">
          <b>Examples:</b><br>
          6 → sirf page 6<br>
          2,6,8 → pages 2, 6 aur 8<br>
          1-5 → pages 1 se 5<br>
          1-3,6,9-10 → mixed selection
        </div>

      </div>

    </div>


    <!-- PAPER SIZE -->
    <div class="section">

      <label for="paperSize">
        Paper Size
      </label>

      <select id="paperSize" name="paper_size">

        <option value="4x6">
          4 × 6 inch
        </option>

        <option value="5x7">
          5 × 7 inch
        </option>

        <option value="A4">
          A4
        </option>

      </select>

    </div>


    <!-- PRINT TYPE -->
    <div class="section">

      <label>
        Print Type
      </label>

      <div class="radio-group">

        <label class="radio-option">

          <input
            type="radio"
            name="print_type"
            value="color"
            checked
          >

          <span>
            Color
          </span>

        </label>


        <label class="radio-option">

          <input
            type="radio"
            name="print_type"
            value="bw"
          >

          <span>
            Black & White
          </span>

        </label>

      </div>

    </div>


    <!-- COPIES -->
    <div class="section">

      <label for="copies">
        Copies
      </label>

      <input
        type="number"
        id="copies"
        name="copies"
        min="1"
        max="20"
        value="1"
        required
      >

    </div>


    <!-- SUBMIT -->
    <button
      type="submit"
      id="submitButton"
      class="print-button"
    >
      Place Print Order
    </button>

  </form>


  <!-- STATUS -->
  <div id="status" class="status"></div>


  <div class="footer">
    Photo Print Service
  </div>

</div>


<!-- PDF.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

  const PHOTO_PRINT_ENDPOINT =
    "https://xpjcbowgfbrridivoung.supabase.co/functions/v1/photo-print";


  const fileInput =
    document.getElementById("photo");

  const fileInfo =
    document.getElementById("fileInfo");

  const pdfBox =
    document.getElementById("pdfBox");

  const pdfPages =
    document.getElementById("pdfPages");

  const pageSelection =
    document.getElementById("pageSelection");

  const preview =
    document.getElementById("preview");

  const previewImage =
    document.getElementById("previewImage");

  const form =
    document.getElementById("printForm");

  const submitButton =
    document.getElementById("submitButton");

  const statusBox =
    document.getElementById("status");


  let selectedFile = null;

  let totalPdfPages = 0;


  /*
   * PDF.JS WORKER
   */
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


  /*
   * STATUS FUNCTION
   */
  function showStatus(message, type) {

    statusBox.textContent = message;

    statusBox.className =
      "status " + type;

  }


  /*
   * FORMAT FILE SIZE
   */
  function formatFileSize(bytes) {

    if (bytes < 1024) {
      return bytes + " B";
    }

    if (bytes < 1024 * 1024) {
      return (bytes / 1024).toFixed(1) + " KB";
    }

    return (bytes / (1024 * 1024)).toFixed(2) + " MB";

  }


  /*
   * CHECK WHETHER FILE IS PDF
   */
  function isPdfFile(file) {

    if (!file) {
      return false;
    }

    return (
      file.type === "application/pdf" ||
      file.name.toLowerCase().endsWith(".pdf")
    );

  }


  /*
   * PARSE PAGE SELECTION
   *
   * Supported:
   * 6
   * 2,6,8
   * 1-5
   * 1-3,6,9-10
   */
  function parsePageSelection(value, totalPages) {

    value = value.trim();

    /*
     * Blank = all pages
     */
    if (!value) {
      return [];
    }

    const parts =
      value
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);

    if (parts.length === 0) {
      throw new Error("Page selection invalid hai.");
    }


    const pages = [];


    for (const part of parts) {

      /*
       * Single page
       */
      if (/^\d+$/.test(part)) {

        const page =
          Number(part);

        if (
          page < 1 ||
          page > totalPages
        ) {
          throw new Error(
            `Page ${page} PDF mein nahi hai. Total pages: ${totalPages}`
          );
        }

        pages.push(page);

        continue;
      }


      /*
       * Range
       */
      const match =
        part.match(/^(\d+)\s*-\s*(\d+)$/);

      if (!match) {

        throw new Error(
          `Invalid page selection: ${part}`
        );

      }


      const start =
        Number(match[1]);

      const end =
        Number(match[2]);


      if (
        start < 1 ||
        end < 1 ||
        start > end ||
        end > totalPages
      ) {

        throw new Error(
          `Invalid range: ${part}. Total pages: ${totalPages}`
        );

      }


      for (
        let page = start;
        page <= end;
        page++
      ) {

        pages.push(page);

      }

    }


    /*
     * Remove duplicates
     * while preserving order
     */
    return [
      ...new Set(pages)
    ];

  }


  /*
   * FILE SELECT
   */
  fileInput.addEventListener(
    "change",
    async function() {

      selectedFile =
        fileInput.files[0] || null;


      totalPdfPages = 0;


      /*
       * Reset UI
       */
      pdfBox.style.display =
        "none";

      preview.style.display =
        "none";

      pageSelection.value =
        "";

      statusBox.className =
        "status";


      if (!selectedFile) {

        fileInfo.textContent =
          "No file selected";

        return;

      }


      fileInfo.textContent =
        selectedFile.name +
        " (" +
        formatFileSize(selectedFile.size) +
        ")";


      /*
       * PDF
       */
      if (isPdfFile(selectedFile)) {

        pdfBox.style.display =
          "block";

        pdfPages.textContent =
          "PDF pages: detecting...";


        try {

          const arrayBuffer =
            await selectedFile.arrayBuffer();


          const loadingTask =
            pdfjsLib.getDocument({
              data: arrayBuffer
            });


          const pdf =
            await loadingTask.promise;


          totalPdfPages =
            pdf.numPages;


          pdfPages.textContent =
            "Total PDF Pages: " +
            totalPdfPages;


        } catch (error) {

          totalPdfPages = 0;

          pdfPages.textContent =
            "PDF read nahi ho pa raha.";


          showStatus(
            "PDF open nahi ho saka. Please valid PDF select karo.",
            "error"
          );

        }


        return;

      }


      /*
       * IMAGE PREVIEW
       */
      if (
        selectedFile.type.startsWith("image/")
      ) {

        const objectUrl =
          URL.createObjectURL(selectedFile);


        previewImage.src =
          objectUrl;


        preview.style.display =
          "block";

      }

    }
  );


  /*
   * PAGE SELECTION LIVE VALIDATION
   */
  pageSelection.addEventListener(
    "input",
    function() {

      if (!totalPdfPages) {
        return;
      }


      const value =
        pageSelection.value.trim();


      if (!value) {

        pageSelection.style.borderColor =
          "";

        return;

      }


      try {

        parsePageSelection(
          value,
          totalPdfPages
        );


        pageSelection.style.borderColor =
          "green";

      } catch (error) {

        pageSelection.style.borderColor =
          "red";

      }

    }
  );


  /*
   * SUBMIT ORDER
   */
  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      /*
       * File check
       */
      if (!selectedFile) {

        showStatus(
          "Please select a photo ya PDF.",
          "error"
        );

        return;

      }


      /*
       * Copies validation
       */
      const copiesInput =
        document.getElementById("copies");


      let copies =
        Number(copiesInput.value);


      if (
        !Number.isFinite(copies) ||
        copies < 1
      ) {

        copies = 1;

      }


      copies =
        Math.floor(copies);


      if (copies > 20) {

        copies = 20;

      }


      copiesInput.value =
        copies;


      /*
       * PDF validation
       */
      let selectedPages = [];


      if (isPdfFile(selectedFile)) {

        if (!totalPdfPages) {

          showStatus(
            "PDF pages detect nahi hue. PDF dobara select karo.",
            "error"
          );

          return;

        }


        try {

          selectedPages =
            parsePageSelection(
              pageSelection.value,
              totalPdfPages
            );

        } catch (error) {

          showStatus(
            error.message,
            "error"
          );

          return;

        }

      }


      /*
       * Disable button
       */
      submitButton.disabled =
        true;

      submitButton.textContent =
        "Sending Order...";


      showStatus(
        "Order submit ho raha hai...",
        "loading"
      );


      try {

        /*
         * FormData
         */
        const formData =
          new FormData();


        formData.append(
          "photo",
          selectedFile
        );


        formData.append(
          "paper_size",
          document.getElementById("paperSize").value
        );


        const printType =
          document.querySelector(
            'input[name="print_type"]:checked'
          ).value;


        formData.append(
          "print_type",
          printType
        );


        formData.append(
          "copies",
          String(copies)
        );


        /*
         * PDF information
         */
        if (isPdfFile(selectedFile)) {

          formData.append(
            "total_pages",
            String(totalPdfPages)
          );


          /*
           * Blank means all pages.
           *
           * We send exactly what user typed.
           */
          formData.append(
            "page_selection",
            pageSelection.value.trim()
          );

        }


        /*
         * Send to Supabase Edge Function
         */
        const response =
          await fetch(
            PHOTO_PRINT_ENDPOINT,
            {
              method: "POST",
              body: formData
            }
          );


        /*
         * Try JSON response
         */
        let result = null;

        try {

          result =
            await response.json();

        } catch (e) {

          result = null;

        }


        if (!response.ok) {

          const errorMessage =
            result &&
            result.error
              ? result.error
              : "Order create nahi hua.";


          throw new Error(
            errorMessage
          );

        }


        if (
          !result ||
          result.success !== true
        ) {

          throw new Error(
            result && result.error
              ? result.error
              : "Order create nahi hua."
          );

        }


        /*
         * SUCCESS
         */
        const order =
          result.order || {};


        let successMessage =
          "Order received successfully!";


        if (order.order_id) {

          successMessage +=
            "\nOrder ID: " +
            order.order_id;

        }


        if (
          isPdfFile(selectedFile) &&
          totalPdfPages
        ) {

          if (pageSelection.value.trim()) {

            successMessage +=
              "\nPages: " +
              pageSelection.value.trim();

          } else {

            successMessage +=
              "\nPages: All (" +
              totalPdfPages +
              ")";

          }

        }


        showStatus(
          successMessage,
          "success"
        );


        /*
         * Reset form after successful order
         */
        form.reset();


        selectedFile = null;

        totalPdfPages = 0;


        fileInfo.textContent =
          "No file selected";


        pdfBox.style.display =
          "none";


        preview.style.display =
          "none";


      } catch (error) {

        console.error(
          "PHOTO PRINT ERROR:",
          error
        );


        showStatus(
          error.message ||
          "Order create nahi hua.",
          "error"
        );

      } finally {

        submitButton.disabled =
          false;

        submitButton.textContent =
          "Place Print Order";

      }

    }
  );

</script>

</body>
</html>
