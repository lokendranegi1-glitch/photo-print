<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Print</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        .container {
            max-width: 520px;
            margin: auto;
            padding: 20px 15px 40px;
        }

        .header {
            background: #111;
            color: white;
            padding: 22px 18px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 18px;
        }

        .header h1 {
            margin: 0 0 6px;
            font-size: 27px;
        }

        .header p {
            margin: 0;
            color: #ccc;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        label.title {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fafafa;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .option input {
            display: none;
        }

        .option label {
            display: block;
            text-align: center;
            padding: 13px 5px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            background: white;
        }

        .option input:checked + label {
            border-color: #111;
            background: #111;
            color: white;
        }

        .type-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .type-option input {
            display: none;
        }

        .type-option label {
            display: block;
            text-align: center;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .type-option input:checked + label {
            border-color: #111;
            background: #111;
            color: white;
        }

        .copies-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .copies-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .copies-controls button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        #copies {
            width: 55px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 8px;
        }

        .preview {
            display: none;
            margin-top: 15px;
            text-align: center;
        }

        .preview img {
            max-width: 100%;
            max-height: 260px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #111;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            display: none;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            display: block;
            background: #e8f8ed;
            color: #18733b;
        }

        .error {
            display: block;
            background: #fdecec;
            color: #b42318;
        }

        .order-id {
            margin-top: 10px;
            font-size: 20px;
            color: #111;
        }

        .note {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📸 Photo Print</h1>
        <p>Upload your photo and place your print order</p>
    </div>

    <form id="printForm">

        <div class="card">
            <label class="title">1. Select Photo</label>

            <input
                type="file"
                id="photo"
                name="photo"
                accept="image/*"
                required
            >

            <div class="preview" id="preview">
                <img id="previewImage">
            </div>
        </div>

        <div class="card">
            <label class="title">2. Paper Size</label>

            <div class="options">

                <div class="option">
                    <input
                        type="radio"
                        id="size4x6"
                        name="paper_size"
                        value="4x6"
                        checked
                    >
                    <label for="size4x6">4 × 6</label>
                </div>

                <div class="option">
                    <input
                        type="radio"
                        id="size5x7"
                        name="paper_size"
                        value="5x7"
                    >
                    <label for="size5x7">5 × 7</label>
                </div>

                <div class="option">
                    <input
                        type="radio"
                        id="sizeA4"
                        name="paper_size"
                        value="A4"
                    >
                    <label for="sizeA4">A4</label>
                </div>

            </div>
        </div>

        <div class="card">
            <label class="title">3. Print Type</label>

            <div class="type-options">

                <div class="type-option">
                    <input
                        type="radio"
                        id="color"
                        name="print_type"
                        value="color"
                        checked
                    >
                    <label for="color">🌈 Color</label>
                </div>

                <div class="type-option">
                    <input
                        type="radio"
                        id="bw"
                        name="print_type"
                        value="bw"
                    >
                    <label for="bw">⚫ B&W</label>
                </div>

            </div>
        </div>

        <div class="card">

            <div class="copies-row">

                <div>
                    <label class="title" style="margin:0;">
                        4. Copies
                    </label>
                    <div style="font-size:13px;color:#777;">
                        Maximum 20
                    </div>
                </div>

                <div class="copies-controls">

                    <button
                        type="button"
                        onclick="changeCopies(-1)"
                    >
                        −
                    </button>

                    <input
                        type="text"
                        id="copies"
                        name="copies"
                        value="1"
                        readonly
                    >

                    <button
                        type="button"
                        onclick="changeCopies(1)"
                    >
                        +
                    </button>

                </div>

            </div>

        </div>

        <div class="card">

            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                🖨️ Place Print Order
            </button>

            <div id="status" class="status"></div>

        </div>

    </form>

    <div class="note">
        Your photo will be sent securely for printing.
    </div>

</div>


<script>

const API_URL =
    "https://xpjcbowgfbrridivoung.supabase.co/functions/v1/photo-print";


function changeCopies(change) {

    const input = document.getElementById("copies");

    let value = parseInt(input.value) || 1;

    value += change;

    if (value < 1) {
        value = 1;
    }

    if (value > 20) {
        value = 20;
    }

    input.value = value;
}


document
    .getElementById("photo")
    .addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {
            document.getElementById("preview").style.display = "none";
            return;
        }

        const url = URL.createObjectURL(file);

        document.getElementById("previewImage").src = url;

        document.getElementById("preview").style.display = "block";
    });


document
    .getElementById("printForm")
    .addEventListener("submit", async function (event) {

        event.preventDefault();

        const photoInput =
            document.getElementById("photo");

        const submitBtn =
            document.getElementById("submitBtn");

        const status =
            document.getElementById("status");

        if (!photoInput.files.length) {

            status.className = "status error";

            status.innerHTML =
                "Please select a photo first.";

            return;
        }

        const file = photoInput.files[0];

        submitBtn.disabled = true;

        submitBtn.innerText =
            "⏳ Sending Order...";

        status.className = "status";
        status.innerHTML = "";

        try {

            const formData = new FormData();

            formData.append(
                "photo",
                file
            );

            formData.append(
                "paper_size",
                document.querySelector(
                    'input[name="paper_size"]:checked'
                ).value
            );

            formData.append(
                "print_type",
                document.querySelector(
                    'input[name="print_type"]:checked'
                ).value
            );

            formData.append(
                "copies",
                document.getElementById("copies").value
            );


            const response = await fetch(
                API_URL,
                {
                    method: "POST",
                    body: formData
                }
            );


            const result = await response.json();


            if (!response.ok || !result.success) {

                throw new Error(
                    result.error ||
                    "Order create nahi hua."
                );
            }


            status.className =
                "status success";

            status.innerHTML =
                `
                ✅ Order Successfully Placed!

                <div class="order-id">
                    Order ID: ${result.order.order_id}
                </div>

                <div style="margin-top:8px;font-weight:normal;">
                    ${result.order.paper_size}
                    •
                    ${result.order.print_type === "color" ? "Color" : "B&W"}
                    •
                    ${result.order.copies} Copy
                </div>

                <div style="margin-top:10px;font-weight:normal;">
                    Your order has been sent for printing.
                </div>
                `;


            document.getElementById("printForm").reset();

            document.getElementById("copies").value = 1;

            document.getElementById("preview").style.display =
                "none";


        } catch (error) {

            console.error(error);

            status.className =
                "status error";

            status.innerHTML =
                "❌ " +
                (error.message ||
                "Order place nahi hua. Please try again.");

        } finally {

            submitBtn.disabled = false;

            submitBtn.innerText =
                "🖨️ Place Print Order";
        }

    });

</script>

</body>
</html>
